[program:bcp-retrieval]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bcp-retrieval.sh
autostart=true
autorestart=unexpected
exitcodes=0
; Model + index load takes 2-3 minutes; do not call it started until it survives that.
startsecs=180
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
# This is necessary for Vast logging to work alongside the Portal logs (Must output to /dev/stdout)
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
